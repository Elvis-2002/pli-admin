name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
            - name: Check Cloudinary configuration
        env:
          CLOUDINARY_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
        run: |
          if [ -z "$CLOUDINARY_NAME" ]; then
            echo "Cloudinary cloud name is EMPTY"
            exit 1
          else
            echo "Cloudinary cloud name is present"
          fi

      - name: Check Firebase API key
        env:
          FIREBASE_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
        run: |
          if [ -z "$FIREBASE_KEY" ]; then
            echo "Firebase API key is EMPTY"
            exit 1
          else
            echo "Firebase API key is present"
            echo "Length: ${#FIREBASE_KEY}"
          fi

      - name: Build
        run: npm run build
        env:
          VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Check built Firebase configuration
        run: |
          echo "Checking production bundle..."
          if grep -R "AIza" dist/assets/ >/dev/null 2>&1; then
            echo "Firebase API key was included in the production build"
          else
            echo "Firebase API key was NOT found in the production build"
            exit 1
          fi

      - name: Check Firebase environment variables
        env:
          API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          FAILED=0

          for name in API_KEY AUTH_DOMAIN PROJECT_ID STORAGE_BUCKET SENDER_ID APP_ID; do
            value="${!name}"

            if [ -z "$value" ]; then
              echo "$name is EMPTY"
              FAILED=1
            else
              echo "$name is present"
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            echo "One or more Firebase environment variables are missing."
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
